<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 0 320 290" role="img" aria-label="Los Toros crest: a crowned red bull with two gold bulls behind it">
  <style>
    .ln   { stroke:var(--ln,#2B1810); stroke-width:var(--lw,3); stroke-linejoin:round; stroke-linecap:round; }
    .ln2  { stroke:var(--ln,#2B1810); stroke-width:var(--lw2,1.8); stroke-linejoin:round; stroke-linecap:round; fill:none; }
    .main { fill:var(--main); }
    .shade{ fill:var(--shade); }
    .hi   { fill:var(--hi); }
    .muz  { fill:var(--muz); }
    .horn { fill:var(--horn); }
    .ear  { fill:var(--muz); }
    .eye  { fill:#FFF8E8; }
    .ink  { fill:var(--ln,#2B1810); }
    .eye  { fill:var(--eye,#FFF8E8); }
    .hatch{ fill:var(--hatch,url(#hatch)); }
  </style>
  <defs>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="1.1" height="4" fill="#2B1810" opacity=".55"/>
    </pattern>
    <linearGradient id="hornL" gradientUnits="userSpaceOnUse" x1="-36" y1="-50" x2="-80" y2="-104">
      <stop offset="0" stop-color="#F3E7CC"/><stop offset=".55" stop-color="#D9C08E"/><stop offset="1" stop-color="#5A3A1E"/>
    </linearGradient>
    <linearGradient id="hornR" gradientUnits="userSpaceOnUse" x1="36" y1="-50" x2="80" y2="-104">
      <stop offset="0" stop-color="#F3E7CC"/><stop offset=".55" stop-color="#D9C08E"/><stop offset="1" stop-color="#5A3A1E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C878"/><stop offset=".55" stop-color="#C49A45"/><stop offset="1" stop-color="#8E6A22"/>
    </linearGradient>

    <!-- Bull head, front view, flash-tattoo style. Origin = bridge of nose. -->
    <g id="bull">
      <!-- horns -->
      <path class="ln" fill="var(--hornL)" d="M-30-44C-50-46-74-48-84-66C-90-78-88-92-80-104C-79-90-76-80-72-74C-60-62-46-58-32-56Z"/>
      <path class="ln" fill="var(--hornR)" d="M30-44C50-46 74-48 84-66C90-78 88-92 80-104C79-90 76-80 72-74C60-62 46-58 32-56Z"/>
      <path class="ln2" d="M-45-47Q-48-52-46-58M-53-50Q-56-55-54-61M-61-53Q-64-58-61-64"/>
      <path class="ln2" d="M45-47Q48-52 46-58M53-50Q56-55 54-61M61-53Q64-58 61-64"/>
      <!-- ears -->
      <path class="ln main" d="M-40-34C-56-42-72-36-80-24C-68-14-52-16-42-20Z"/>
      <path class="ear" d="M-46-30C-56-34-66-31-72-25C-63-20-53-21-46-24Z"/>
      <path class="ln main" d="M40-34C56-42 72-36 80-24C68-14 52-16 42-20Z"/>
      <path class="ear" d="M46-30C56-34 66-31 72-25C63-20 53-21 46-24Z"/>
      <!-- head -->
      <path class="ln main" d="M-34-50C-20-60 20-60 34-50C44-40 48-32 44-18C40 0 32 14 30 30C29 40 38 46 34 56C28 66 14 70 0 70C-14 70-28 66-34 56C-38 46-29 40-30 30C-32 14-40 0-44-18C-48-32-44-40-34-50Z"/>
      <!-- cheek shadows + engraving hatch -->
      <path class="shade" d="M-44-18C-40 0-32 14-30 30C-36 18-40 6-41-6C-42-12-43-15-44-18Z"/>
      <path class="shade" d="M44-18C40 0 32 14 30 30C36 18 40 6 41-6C42-12 43-15 44-18Z"/>
      <path class="hatch" d="M-42-12C-38 4-33 16-30 30C-24 18-22 2-24-10Z"/>
      <path class="hatch" d="M42-12C38 4 33 16 30 30C24 18 22 2 24-10Z"/>
      <!-- nose-bridge highlight -->
      <path class="hi" d="M-7-34C-5-14-7 8-11 30L11 30C7 8 5-14 7-34C3-37-3-37-7-34Z"/>
      <!-- angry brow ridges -->
      <path class="ln shade" d="M-42-30C-30-31-14-25-3-13C-16-15-30-15-42-20Z"/>
      <path class="ln shade" d="M42-30C30-31 14-25 3-13C16-15 30-15 42-20Z"/>
      <!-- eyes -->
      <path class="ln eye" style="--lw:2" d="M-33-15C-25-15-16-11-9-6C-19-5-28-9-33-15Z"/>
      <path class="ln eye" style="--lw:2" d="M33-15C25-15 16-11 9-6C19-5 28-9 33-15Z"/>
      <!-- forehead curls -->
      <path class="ln2" d="M-16-53C-12-46-6-48-3-42M16-53C12-46 6-48 3-42M-6-56C-4-50 0-50 0-45M6-56C4-50 0-50 0-45"/>
      <!-- muzzle -->
      <path class="ln muz" d="M-26 36C-30 46-28 60-16 64C-8 67 8 67 16 64C28 60 30 46 26 36C16 30-16 30-26 36Z"/>
      <path class="hatch" d="M-26 40C-28 50-26 58-18 62C-22 54-24 46-22 38Z"/>
      <path class="hatch" d="M26 40C28 50 26 58 18 62C22 54 24 46 22 38Z"/>
      <ellipse class="ink" cx="-12" cy="49" rx="5" ry="7.5" transform="rotate(-22 -12 49)"/>
      <ellipse class="ink" cx="12" cy="49" rx="5" ry="7.5" transform="rotate(22 12 49)"/>
      <path class="ln2" d="M-12 62Q0 58 12 62"/>
    </g>
  </defs>

  <!-- back bulls: gold -->
  <g transform="translate(118 158) scale(.6)" style="--main:url(#goldGrad);--shade:#8E6A22;--hi:#EBD08E;--muz:#D9B66A;--hornL:#F1E3BE;--hornR:#F1E3BE">
    <use href="#bull"/>
  </g>
  <g transform="translate(282 158) scale(.6)" style="--main:url(#goldGrad);--shade:#8E6A22;--hi:#EBD08E;--muz:#D9B66A;--hornL:#F1E3BE;--hornR:#F1E3BE">
    <use href="#bull"/>
  </g>

  <!-- center bull: red -->
  <g transform="translate(200 186) scale(1.02)" style="--main:#B3242A;--shade:#741015;--hi:#D2493F;--muz:#C95048;--hornL:url(#hornL);--hornR:url(#hornR)">
    <!-- knockout halo so it separates from the bulls behind -->
    <use href="#bull" style="--main:#FFFDF7;--shade:#FFFDF7;--hi:#FFFDF7;--muz:#FFFDF7;--hornL:#FFFDF7;--hornR:#FFFDF7;--ln:#FFFDF7;--lw:12;--lw2:0;--eye:#FFFDF7;--hatch:#FFFDF7"/>
    <use href="#bull"/>
  </g>

  <!-- crown -->
  <g transform="translate(200 64)">
    <path class="ln" fill="url(#goldGrad)" d="M-34 6L-40-24L-22-10L-12-34L0-16L12-34L22-10L40-24L34 6Z"/>
    <path class="hatch" d="M-34 6L-38-16L-26-6Z"/>
    <rect class="ln" fill="url(#goldGrad)" x="-37" y="5" width="74" height="11" rx="2"/>
    <circle class="ln" fill="#E7C878" stroke-width="2" cx="-40" cy="-27" r="3.6"/>
    <circle class="ln" fill="#E7C878" stroke-width="2" cx="-12" cy="-37" r="3.6"/>
    <circle class="ln" fill="#E7C878" stroke-width="2" cx="12" cy="-37" r="3.6"/>
    <circle class="ln" fill="#E7C878" stroke-width="2" cx="40" cy="-27" r="3.6"/>
    <path class="ln" fill="#E7C878" stroke-width="2" d="M0-24L4-30L0-40L-4-30Z"/>
    <circle class="ln" fill="#B3242A" stroke-width="1.8" cx="0" cy="10.5" r="3.4"/>
    <circle class="ln" fill="#B3242A" stroke-width="1.8" cx="-22" cy="10.5" r="2.4"/>
    <circle class="ln" fill="#B3242A" stroke-width="1.8" cx="22" cy="10.5" r="2.4"/>
  </g>
</svg>
