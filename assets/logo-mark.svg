<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Los Toros crest: a crowned bull with two bulls behind it">
  <defs>
    <linearGradient id="lt-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2C27A"/>
      <stop offset=".5" stop-color="#B8913A"/>
      <stop offset="1" stop-color="#8E6A22"/>
    </linearGradient>
    <linearGradient id="lt-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0242C"/>
      <stop offset="1" stop-color="#7E0F16"/>
    </linearGradient>
    <!-- one bull head, front view, origin at the bridge of the nose -->
    <g id="lt-bull">
      <path d="M-18-26C-44-28-60-44-56-74C-50-55-38-45-16-41Z"/>
      <path d="M18-26C44-28 60-44 56-74C50-55 38-45 16-41Z"/>
      <path d="M-23-24C-36-27-49-21-54-11C-43-6-31-10-21-14Z"/>
      <path d="M23-24C36-27 49-21 54-11C43-6 31-10 21-14Z"/>
      <path d="M-26-40C-10-47 10-47 26-40C31-28 29-12 24 0C20 11 19 20 21 30C23 43 13 49 0 49C-13 49-23 43-21 30C-19 20-20 11-24 0C-29-12-31-28-26-40Z"/>
    </g>
    <g id="lt-bull-detail" fill="#fff" stroke="none">
      <path d="M-21-13Q-14-19-7-10Q-15-9-21-13Z"/>
      <path d="M21-13Q14-19 7-10Q15-9 21-13Z"/>
      <path d="M0-38L5-30L0-22L-5-30Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M-10 33C-13 36-12 41-8 41C-6 39-6 35-10 33Z"/>
      <path d="M10 33C13 36 12 41 8 41C6 39 6 35 10 33Z"/>
      <path d="M-15 24Q0 29 15 24" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>
    </g>
  </defs>

  <!-- back bulls -->
  <g transform="translate(108 158) scale(.74)">
    <use href="#lt-bull" fill="#fff" stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
    <use href="#lt-bull" fill="url(#lt-gold)"/>
    <use href="#lt-bull-detail" stroke-width="1"/>
  </g>
  <g transform="translate(292 158) scale(.74)">
    <use href="#lt-bull" fill="#fff" stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
    <use href="#lt-bull" fill="url(#lt-gold)"/>
    <use href="#lt-bull-detail" stroke-width="1"/>
  </g>

  <!-- center bull -->
  <g transform="translate(200 196) scale(1.3)">
    <use href="#lt-bull" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
    <use href="#lt-bull" fill="url(#lt-red)" stroke="url(#lt-gold)" stroke-width="1.6" stroke-linejoin="round"/>
    <use href="#lt-bull-detail"/>
  </g>

  <!-- crown -->
  <g transform="translate(200 92)">
    <path d="M-34 0L-38-32L-19-14L0-40L19-14L38-32L34 0Z" fill="url(#lt-gold)"/>
    <rect x="-36" y="1" width="72" height="8" rx="1.5" fill="url(#lt-gold)"/>
    <circle cx="-38" cy="-35" r="3.6" fill="url(#lt-gold)"/>
    <circle cx="0" cy="-44" r="4.2" fill="url(#lt-gold)"/>
    <circle cx="38" cy="-35" r="3.6" fill="url(#lt-gold)"/>
    <circle cx="0" cy="5" r="2.6" fill="#A3171F"/>
    <circle cx="-20" cy="5" r="1.8" fill="#A3171F"/>
    <circle cx="20" cy="5" r="1.8" fill="#A3171F"/>
  </g>
</svg>
