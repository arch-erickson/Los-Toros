<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Engraved-style icons. Ink = currentColor; accents use --accent. 48x48 grid. -->
  <defs>
    <pattern id="ico-hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width=".9" height="3" fill="currentColor"/>
    </pattern>
  </defs>

  <!-- Vintage map marker with a crown -->
  <symbol id="i-pin" viewBox="0 0 48 48">
    <path d="M24 45C24 45 9 29 9 18A15 15 0 0 1 39 18C39 29 24 45 24 45Z" fill="var(--accent,#A3171F)" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M30 8C35 11 37 16 36 22C34 30 27 38 24 41C28 34 32 27 32 19C32 14 31 11 30 8Z" fill="url(#ico-hatch)" opacity=".6"/>
    <circle cx="24" cy="18" r="8" fill="#FBF6EA" stroke="currentColor" stroke-width="1.5"/>
    <path d="M19.5 21L18.5 15L21.5 17.5L24 13.5L26.5 17.5L29.5 15L28.5 21Z" fill="var(--gold,#B8913A)" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
  </symbol>

  <!-- Candlestick telephone -->
  <symbol id="i-phone" viewBox="0 0 48 48">
    <!-- base -->
    <path d="M12 44C12 40 16 38 21 38H27C32 38 36 40 36 44Z" fill="var(--accent,#A3171F)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- stem -->
    <path d="M22 38V16H26V38" fill="#FBF6EA" stroke="currentColor" stroke-width="1.6"/>
    <path d="M24.6 18V37" stroke="currentColor" stroke-width=".8" opacity=".6"/>
    <!-- mouthpiece -->
    <path d="M18 8C18 6 20 5 24 5C28 5 30 6 30 8L27 15H21Z" fill="var(--gold,#B8913A)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <ellipse cx="24" cy="7" rx="6" ry="1.6" fill="currentColor"/>
    <!-- hook + receiver -->
    <path d="M26 22H33" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M33 19V32" stroke="currentColor" stroke-width="2"/>
    <path d="M31 16H35C36 16 37 17 37 18V19H31V18C31 17 31 16 31 16Z" fill="var(--accent,#A3171F)" stroke="currentColor" stroke-width="1.4"/>
    <!-- cord -->
    <path d="M33 32C33 36 38 36 38 40C38 43 34 43 33 44" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- NYC subway token -->
  <symbol id="i-token" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="19" fill="var(--gold,#B8913A)" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="24" cy="24" r="15" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1.5 2.2"/>
    <!-- Y cut-out -->
    <path d="M17 12L22 12L24 18L26 12L31 12L26.5 23V34H21.5V23Z" fill="#FBF6EA" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M10 30C13 38 21 42 29 41" fill="none" stroke="currentColor" stroke-width=".9" opacity=".5"/>
  </symbol>

  <!-- Straight razor (for dividers / future sections) -->
  <symbol id="i-razor" viewBox="0 0 48 48">
    <path d="M6 30L30 10C33 8 37 8 39 11L41 13L17 34Z" fill="#FBF6EA" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M17 34L22 38C20 42 15 44 11 42C8 41 7 38 9 35Z" fill="var(--accent,#A3171F)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M12 28L33 11" stroke="currentColor" stroke-width=".8" opacity=".55"/>
  </symbol>

  <!-- Barber pole -->
  <symbol id="i-pole" viewBox="0 0 48 48">
    <rect x="18" y="4" width="12" height="4" rx="1" fill="var(--gold,#B8913A)" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="24" cy="3" r="1.8" fill="var(--gold,#B8913A)" stroke="currentColor" stroke-width="1"/>
    <rect x="19.5" y="8" width="9" height="32" fill="#FBF6EA" stroke="currentColor" stroke-width="1.4"/>
    <path d="M19.5 12L28.5 8V13L19.5 17ZM19.5 21L28.5 17V22L19.5 26ZM19.5 30L28.5 26V31L19.5 35ZM19.5 39L28.5 35V40H24Z" fill="var(--accent,#A3171F)"/>
    <rect x="18" y="40" width="12" height="4" rx="1" fill="var(--gold,#B8913A)" stroke="currentColor" stroke-width="1.4"/>
  </symbol>

  <!-- Pocket watch (hours) -->
  <symbol id="i-watch" viewBox="0 0 48 48">
    <circle cx="24" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <rect x="21.5" y="7" width="5" height="4" rx="1" fill="var(--gold,#B8913A)" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="24" cy="28" r="17" fill="var(--gold,#B8913A)" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="24" cy="28" r="13" fill="#FBF6EA" stroke="currentColor" stroke-width="1.2"/>
    <path d="M24 17V19M24 37V39M13 28H15M33 28H35" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M24 28V21M24 28L29 31" stroke="var(--accent,#A3171F)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="24" cy="28" r="1.4" fill="currentColor"/>
  </symbol>
</svg>
